<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Reham</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #090d16 url('1000150926.jpg') center/cover no-repeat fixed;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #3b82f6;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { font-size: 2.2rem; margin-bottom: 15px; color: #60a5fa; }
        p { font-size: 1.1rem; line-height: 1.8; margin-bottom: 25px; }
        audio { width: 100%; margin-top: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>About Reham 🤍</h1>
        <p>كل عام وأنتِ بخير يا رحمة، يا صاحبة القلم والأثر الجميل. هذا الإصدار السريع والمستقر خصيصاً لكِ لتعمل الموسيقى بسلاسة تامة!</p>
        
        <!-- مشغل الصوت المحلي المباشر -->
        <audio controls autoplay loop>
            <source src="813L32Mb.mp3" type="audio/mp3">
            متصفحك لا يدعم تشغيل الصوت
        </audio>
    </div>
</body>
</html>
